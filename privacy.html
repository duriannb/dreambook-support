  <style>
    :root{--bg:#fff;--card:#f3f6fc;--label:#1d1d1f;--label-2:#6e6e73;--tint:#2F6DF0;--border:rgba(0,0,0,.08)}

    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
    .wrap{max-width:680px;margin:0 auto;padding:20px 20px 80px}
    .lang-bar{text-align:right;padding:12px 0 4px}
    select{font:inherit;color:var(--label);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
    header{text-align:center;margin:24px 0 44px}
    .logo{width:84px;height:84px;border-radius:20px;margin-bottom:16px;object-fit:cover;box-shadow:0 4px 16px rgba(0,0,0,.12)}
    h1{font-size:30px;margin:8px 0 4px;letter-spacing:-.02em}
    .tagline{color:var(--label-2);font-size:16px;margin:0}
    h2{font-size:20px;margin:40px 0 12px;letter-spacing:-.01em}
    p{margin:0 0 12px}
    .muted{color:var(--label-2);font-size:15px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin:16px 0}
    a{color:var(--tint);text-decoration:none}
    a:hover{text-decoration:underline}
    .contact-btn{display:inline-block;background:var(--tint);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;margin-top:8px;min-height:44px;line-height:20px}
    @media (prefers-color-scheme:dark){.contact-btn{color:#000}}
    .contact-btn:hover{text-decoration:none;opacity:.9}
    footer{text-align:center;color:var(--label-2);font-size:13px;margin-top:48px}
    .back{display:inline-block;margin:8px 0 20px;font-size:15px}
    .eff{color:var(--label-2);font-size:14px;margin:0 0 24px}
  </style>

  <script>
    const I18N = {"en": {"title": "Privacy Policy", "eff": "Effective date: November 4, 2026", "back": "DreamBook", "intro": "DreamBook (“the App”) is a pop-up storybook app for families. There is no account to create, and we do not collect personal information about you or your child. This policy explains exactly what the App does with your information.", "s1t": "1. Information we do not collect", "s1b": "The App has no sign-up or sign-in. It does not collect your name, email address, location, contacts, photos or microphone audio, and it contains no advertising and no third-party analytics or tracking.", "s2t": "2. What stays on your device", "s2b": "Your reading history, saved views, bookshelf, language and appearance settings, and the books you have downloaded are stored only on this device. They are not uploaded to us. Removing the App removes them.", "s3t": "3. Our book library server", "s3b": "To show the library and download books, the App contacts our server: it asks for the list of books, cover images and book files. No account or personal identifier is sent. As with any internet request, the server receives your IP address and basic technical details in ordinary access logs, which we use only to run the service and protect it from abuse (for example, rate limiting).", "s4t": "4. Purchases and Pro books", "s4b": "Purchases are processed by Apple through the App Store; your payment method and Apple Account details are never visible to us. To download a book that requires Pro, the App sends our server the Apple-signed record of your Pro transaction, which the server checks on its own. It contains transaction details only — not your name, email or payment method — and is used only to decide whether the download is allowed and to limit abuse.", "s5t": "5. Feedback you send", "s5b": "If you send feedback from the App, we receive what you choose to write, the optional contact detail you type, up to three images you attach, and a few technical details added automatically: the App version, iOS version, device model and language setting. We use them only to understand and fix problems and to reply to you. Please don’t include sensitive information. You can ask us to delete a message you sent.", "s6t": "6. Reading and read-aloud", "s6b": "Downloaded books are displayed from files stored on your device. Read-aloud uses the speech voices built into iOS, on the device itself; the text is not sent anywhere and the App does not record audio.", "s7t": "7. Checking for updates", "s7b": "To tell you when a newer version is available, the App may query Apple’s public App Store lookup service. Only the App’s store number is sent — nothing about you.", "s8t": "8. Keeping and deleting your data", "s8b": "Data on your device is deleted when you remove the App. Feedback is kept only as long as we need it to deal with your message; write to us and we will delete it earlier on request. Server access logs are used only to operate and secure the service.", "s9t": "9. Children’s privacy", "s9b": "The App is designed to be read by families and does not knowingly collect personal information from children under 13. The feedback form is intended for parents and guardians.", "s10t": "10. Third-party services", "s10b": "The App uses Apple’s services (the App Store and StoreKit) for purchases and update checks. Its reading engine is open-source software (three.js) bundled inside the App and runs entirely on your device. We do not share any information with advertisers or data brokers.", "s11t": "11. Changes to this policy", "s11b": "If this policy changes, the updated version is posted on this page and the effective date is revised.", "s12t": "12. Contact us", "s12b": "If you have any questions about this policy, contact:"}, "zh-Hans": {"title": "隐私政策", "eff": "生效日期：2026 年 11 月 4 日", "back": "梦幻绘本", "intro": "梦幻绘本（以下称「App」）是一款给家庭阅读的立体绘本 App。你不需要注册账号，我们也不收集你或孩子的个人信息。这份政策逐条说明 App 究竟怎么处理你的信息。", "s1t": "1. 我们不会收集什么", "s1b": "App 没有注册与登录。它不收集你的姓名、邮箱、位置、联系人、照片或麦克风音频，也不含任何广告，不使用第三方统计或追踪。", "s2t": "2. 只留在你设备上的内容", "s2b": "你的阅读历史、保存的视角、书架、语言与外观设置，以及已下载的书，都只保存在这台设备上，不会上传给我们。卸载 App 就会一并清除。", "s3t": "3. 我们的书库服务器", "s3b": "为了展示书库并下载书，App 会访问我们的服务器：请求书目列表、封面图和书的文件。这些请求里不带任何账号或个人标识。与任何网络请求一样，服务器会在常规访问日志里看到你的 IP 地址和基本的技术信息，我们只用它来运行服务、防止滥用（例如限流）。", "s4t": "4. 购买与 Pro 书籍", "s4b": "购买由 Apple 通过 App Store 完成，你的付款方式与 Apple 账户信息我们一概看不到。下载需要 Pro 的书时，App 会把 Apple 签名的 Pro 交易记录发给我们的服务器，由服务器自行验签。其中只有交易信息，不含你的姓名、邮箱或付款方式，仅用于判断能否下载以及限制滥用。", "s5t": "5. 你发送的意见反馈", "s5b": "如果你在 App 里发送意见反馈，我们会收到你写的内容、你自愿填写的联系方式、最多三张你附上的图片，以及自动附带的几项技术信息：App 版本、iOS 版本、设备型号和语言设置。我们只用它们来了解并修复问题、回复你。请不要在其中包含敏感信息。你可以要求我们删除你发送过的反馈。", "s6t": "6. 阅读与朗读", "s6b": "已下载的书从你设备上的文件里显示。朗读使用 iOS 自带的语音，在设备本机合成；文字不会发往任何地方，App 也不录音。", "s7t": "7. 检查更新", "s7b": "为了在有新版本时提醒你，App 可能会访问 Apple 公开的 App Store 查询接口，只发送 App 的商店编号，不含任何关于你的信息。", "s8t": "8. 数据的保留与删除", "s8b": "设备上的数据在你卸载 App 时删除。意见反馈只在我们处理你的来信所需的时间内保留；你写信给我们，我们可以提前删除。服务器的访问日志只用于运行与保护服务。", "s9t": "9. 儿童隐私", "s9b": "App 为家庭共读而设计，不会有意收集 13 岁以下儿童的个人信息。意见反馈入口面向家长与监护人。", "s10t": "10. 第三方服务", "s10b": "App 使用 Apple 的服务（App Store 与 StoreKit）完成购买与更新检查。它的阅读引擎是内置在 App 里的开源软件（three.js），完全在你的设备上运行。我们不会向广告商或数据经纪商共享任何信息。", "s11t": "11. 政策的变更", "s11b": "这份政策若有变更，我们会把新版本贴在本页，并同时更新生效日期。", "s12t": "12. 联系我们", "s12b": "对这份政策有任何疑问，请联系："}, "zh-Hant": {"title": "隱私權政策", "eff": "生效日期：2026 年 11 月 4 日", "back": "夢幻繪本", "intro": "夢幻繪本（以下稱「App」）是一款給家庭閱讀的立體繪本 App。你不需要註冊帳號，我們也不蒐集你或孩子的個人資訊。這份政策逐條說明 App 究竟怎麼處理你的資訊。", "s1t": "1. 我們不會蒐集什麼", "s1b": "App 沒有註冊與登入。它不蒐集你的姓名、電子郵件、位置、聯絡人、照片或麥克風音訊，也不含任何廣告，不使用第三方統計或追蹤。", "s2t": "2. 只留在你裝置上的內容", "s2b": "你的閱讀紀錄、儲存的視角、書架、語言與外觀設定，以及已下載的書，都只儲存在這台裝置上，不會上傳給我們。移除 App 就會一併清除。", "s3t": "3. 我們的書庫伺服器", "s3b": "為了顯示書庫並下載書，App 會連到我們的伺服器：請求書目清單、封面圖和書的檔案。這些請求裡不帶任何帳號或個人識別資訊。與任何網路請求一樣，伺服器會在一般存取記錄裡看到你的 IP 位址和基本的技術資訊，我們只用它來運行服務、防止濫用（例如限流）。", "s4t": "4. 購買與 Pro 書籍", "s4b": "購買由 Apple 透過 App Store 完成，你的付款方式與 Apple 帳號資訊我們一概看不到。下載需要 Pro 的書時，App 會把 Apple 簽署的 Pro 交易紀錄傳給我們的伺服器，由伺服器自行驗證。其中只有交易資訊，不含你的姓名、電子郵件或付款方式，僅用於判斷能否下載以及限制濫用。", "s5t": "5. 你傳送的意見回饋", "s5b": "如果你在 App 裡傳送意見回饋，我們會收到你寫的內容、你自願填寫的聯絡方式、最多三張你附上的圖片，以及自動附帶的幾項技術資訊：App 版本、iOS 版本、裝置型號和語言設定。我們只用它們來了解並修復問題、回覆你。請不要在其中包含敏感資訊。你可以要求我們刪除你傳送過的回饋。", "s6t": "6. 閱讀與朗讀", "s6b": "已下載的書從你裝置上的檔案顯示。朗讀使用 iOS 內建的語音，在裝置本機合成；文字不會傳往任何地方，App 也不錄音。", "s7t": "7. 檢查更新", "s7b": "為了在有新版本時提醒你，App 可能會連到 Apple 公開的 App Store 查詢服務，只傳送 App 的商店編號，不含任何關於你的資訊。", "s8t": "8. 資料的保留與刪除", "s8b": "裝置上的資料在你移除 App 時刪除。意見回饋只在我們處理你的來信所需的時間內保留；你寫信給我們，我們可以提前刪除。伺服器的存取記錄只用於運行與保護服務。", "s9t": "9. 兒童隱私", "s9b": "App 為家庭共讀而設計，不會有意蒐集 13 歲以下兒童的個人資訊。意見回饋入口面向家長與監護人。", "s10t": "10. 第三方服務", "s10b": "App 使用 Apple 的服務（App Store 與 StoreKit）完成購買與更新檢查。它的閱讀引擎是內建在 App 裡的開源軟體（three.js），完全在你的裝置上運行。我們不會向廣告商或資料掮客分享任何資訊。", "s11t": "11. 政策的變更", "s11b": "這份政策若有變更，我們會把新版本貼在本頁，並同時更新生效日期。", "s12t": "12. 聯絡我們", "s12b": "對這份政策有任何疑問，請聯絡："}, "ja": {"title": "プライバシーポリシー", "eff": "施行日：2026年11月4日", "back": "DreamBook", "intro": "DreamBook（以下「本アプリ」）は、家族で楽しむ飛び出す絵本アプリです。アカウントの作成は不要で、あなたやお子さまの個人情報は収集しません。このポリシーでは、本アプリが情報をどう扱うかを項目ごとに説明します。", "s1t": "1. 収集しない情報", "s1b": "本アプリには登録もサインインもありません。氏名、メールアドレス、位置情報、連絡先、写真、マイクの音声は収集しません。広告はなく、第三者の解析や追跡も使っていません。", "s2t": "2. 端末の中にだけ残るもの", "s2b": "閲覧履歴、保存した視点、本棚、言語や外観の設定、ダウンロードした本は、この端末にのみ保存され、当社には送信されません。アプリを削除すると一緒に消えます。", "s3t": "3. 当社の書庫サーバー", "s3b": "ライブラリの表示と本のダウンロードのため、本アプリは当社のサーバーに接続し、本の一覧、表紙画像、本のファイルを取得します。アカウントや個人を特定する識別子は送りません。一般的なインターネット通信と同様に、サーバーは通常のアクセスログとして IP アドレスと基本的な技術情報を受け取ります。これはサービスの運用と不正利用の防止（たとえば回数制限）にのみ使用します。", "s4t": "4. 購入と Pro の本", "s4b": "購入は Apple が App Store を通じて処理し、お支払い方法や Apple アカウントの情報が当社に見えることはありません。Pro が必要な本をダウンロードするとき、本アプリは Apple が署名した Pro の取引記録を当社のサーバーに送り、サーバーが自ら検証します。そこに含まれるのは取引情報だけで、氏名・メールアドレス・お支払い方法は含まれず、ダウンロードの可否の判断と不正利用の抑制にのみ使います。", "s5t": "5. 送信されたご意見", "s5b": "アプリからご意見を送信すると、入力された内容、任意で入力された連絡先、添付された最大 3 枚の画像に加え、自動的に付く技術情報（アプリのバージョン、iOS のバージョン、端末モデル、言語設定）を受け取ります。これらは問題の把握と修正、そしてご返信のためにのみ使用します。機密情報は含めないでください。送信した内容の削除をご依頼いただくこともできます。", "s6t": "6. 閲覧と読み上げ", "s6b": "ダウンロード済みの本は、端末内のファイルから表示されます。読み上げは iOS 内蔵の音声を端末上で使うため、テキストはどこにも送信されず、本アプリが録音することもありません。", "s7t": "7. アップデートの確認", "s7b": "新しいバージョンをお知らせするため、本アプリは Apple が公開している App Store の照会サービスに接続することがあります。送信するのはアプリのストア番号だけで、あなたに関する情報は含まれません。", "s8t": "8. データの保管と削除", "s8b": "端末内のデータは、アプリを削除すると消去されます。ご意見は、対応に必要な期間だけ保管し、ご連絡いただければ早期に削除します。サーバーのアクセスログは、サービスの運用と保護にのみ使用します。", "s9t": "9. お子さまのプライバシー", "s9b": "本アプリは家族で読むことを想定しており、13 歳未満のお子さまの個人情報を意図して収集することはありません。ご意見の送信は保護者の方を対象としています。", "s10t": "10. 第三者のサービス", "s10b": "本アプリは、購入とアップデート確認に Apple のサービス（App Store と StoreKit）を使います。閲覧エンジンはアプリに同梱されたオープンソースソフトウェア（three.js）で、すべて端末上で動作します。広告事業者やデータブローカーに情報を提供することはありません。", "s11t": "11. ポリシーの変更", "s11b": "このポリシーを変更した場合は、更新版をこのページに掲載し、施行日を改めます。", "s12t": "12. お問い合わせ", "s12b": "このポリシーに関するご質問は、こちらまで："}, "ko": {"title": "개인정보 처리방침", "eff": "시행일: 2026년 11월 4일", "back": "DreamBook", "intro": "DreamBook(이하 ‘앱’)은 가족이 함께 보는 팝업 동화책 앱입니다. 계정을 만들 필요가 없으며, 이용자나 자녀의 개인정보를 수집하지 않습니다. 이 방침은 앱이 정보를 어떻게 다루는지 항목별로 설명합니다.", "s1t": "1. 수집하지 않는 정보", "s1b": "앱에는 가입이나 로그인이 없습니다. 이름, 이메일 주소, 위치, 연락처, 사진, 마이크 음성을 수집하지 않으며, 광고도 없고 제3자 분석이나 추적도 사용하지 않습니다.", "s2t": "2. 기기에만 남는 정보", "s2b": "읽은 기록, 저장한 시점, 책장, 언어와 화면 설정, 내려받은 책은 이 기기에만 저장되며 저희에게 전송되지 않습니다. 앱을 삭제하면 함께 삭제됩니다.", "s3t": "3. 저희 서재 서버", "s3b": "서재를 보여 주고 책을 내려받기 위해 앱은 저희 서버에 접속하여 책 목록, 표지 이미지, 책 파일을 요청합니다. 계정이나 개인 식별자는 전송되지 않습니다. 일반적인 인터넷 요청과 마찬가지로 서버는 일반 접속 로그로 IP 주소와 기본 기술 정보를 받으며, 이는 서비스 운영과 남용 방지(예: 요청 횟수 제한)에만 사용합니다.", "s4t": "4. 구매와 Pro 책", "s4b": "구매는 Apple이 App Store를 통해 처리하며, 결제 수단과 Apple 계정 정보는 저희에게 보이지 않습니다. Pro가 필요한 책을 내려받을 때 앱은 Apple이 서명한 Pro 거래 기록을 저희 서버에 보내고, 서버가 이를 자체적으로 검증합니다. 여기에는 거래 정보만 있고 이름, 이메일, 결제 수단은 없으며, 내려받기 허용 여부 판단과 남용 방지에만 사용합니다.", "s5t": "5. 보내 주신 의견", "s5b": "앱에서 의견을 보내시면 작성하신 내용, 선택 입력하신 연락처, 첨부하신 이미지(최대 3장)와 함께 자동으로 붙는 기술 정보(앱 버전, iOS 버전, 기기 모델, 언어 설정)를 받습니다. 이는 문제를 파악하고 고치며 답변하는 데에만 사용합니다. 민감한 정보는 포함하지 마세요. 보내신 의견의 삭제를 요청하실 수 있습니다.", "s6t": "6. 읽기와 읽어 주기", "s6b": "내려받은 책은 기기에 저장된 파일에서 표시됩니다. 읽어 주기는 기기 안에서 iOS 내장 음성을 사용하므로 텍스트가 어디로도 전송되지 않으며, 앱은 음성을 녹음하지 않습니다.", "s7t": "7. 업데이트 확인", "s7b": "새 버전을 알려 드리기 위해 앱은 Apple이 공개한 App Store 조회 서비스에 접속할 수 있습니다. 앱의 스토어 번호만 전송되며 이용자에 관한 정보는 없습니다.", "s8t": "8. 데이터 보관 및 삭제", "s8b": "기기의 데이터는 앱을 삭제하면 지워집니다. 의견은 처리에 필요한 기간 동안만 보관하며, 요청하시면 더 일찍 삭제합니다. 서버 접속 로그는 서비스 운영과 보안에만 사용합니다.", "s9t": "9. 아동 개인정보", "s9b": "앱은 가족이 함께 읽도록 만들어졌으며 만 13세 미만 아동의 개인정보를 의도적으로 수집하지 않습니다. 의견 보내기는 보호자를 위한 기능입니다.", "s10t": "10. 제3자 서비스", "s10b": "앱은 구매와 업데이트 확인에 Apple의 서비스(App Store, StoreKit)를 사용합니다. 읽기 엔진은 앱에 포함된 오픈소스 소프트웨어(three.js)이며 모두 기기에서 실행됩니다. 광고주나 데이터 브로커에게 어떤 정보도 제공하지 않습니다.", "s11t": "11. 방침의 변경", "s11b": "이 방침이 변경되면 갱신된 내용을 이 페이지에 게시하고 시행일을 고칩니다.", "s12t": "12. 문의", "s12b": "이 방침에 대해 궁금한 점이 있으시면 다음으로 연락해 주세요:"}, "de": {"title": "Datenschutzerklärung", "eff": "Gültig ab: 4. November 2026", "back": "DreamBook", "intro": "DreamBook („die App“) ist eine Pop-up-Bilderbuch-App für Familien. Es gibt kein Konto, und wir erheben keine personenbezogenen Daten über dich oder dein Kind. Diese Erklärung beschreibt genau, was die App mit deinen Informationen macht.", "s1t": "1. Daten, die wir nicht erheben", "s1b": "Die App hat weder Registrierung noch Anmeldung. Sie erfasst weder deinen Namen, deine E-Mail-Adresse, deinen Standort, Kontakte, Fotos noch Mikrofon-Audio, enthält keine Werbung und keine Analyse- oder Tracking-Dienste von Dritten.", "s2t": "2. Was auf deinem Gerät bleibt", "s2b": "Dein Leseverlauf, gespeicherte Ansichten, das Bücherregal, Sprach- und Darstellungseinstellungen sowie die geladenen Bücher liegen nur auf diesem Gerät. Sie werden nicht an uns übertragen. Wenn du die App löschst, sind sie weg.", "s3t": "3. Unser Bibliotheksserver", "s3b": "Um die Bibliothek anzuzeigen und Bücher zu laden, kontaktiert die App unseren Server: Sie fragt die Buchliste, Titelbilder und Buchdateien ab. Dabei wird weder ein Konto noch eine persönliche Kennung gesendet. Wie bei jeder Internetanfrage erhält der Server in den üblichen Zugriffsprotokollen deine IP-Adresse und grundlegende technische Angaben; wir nutzen sie nur, um den Dienst zu betreiben und vor Missbrauch zu schützen (zum Beispiel durch Anfragebegrenzung).", "s4t": "4. Käufe und Pro-Bücher", "s4b": "Käufe wickelt Apple über den App Store ab; deine Zahlungsart und Apple-Account-Daten sehen wir nie. Zum Laden eines Buchs, das Pro erfordert, sendet die App unserem Server den von Apple signierten Nachweis deiner Pro-Transaktion, den der Server selbst prüft. Er enthält nur Transaktionsdaten – nicht deinen Namen, deine E-Mail-Adresse oder Zahlungsart – und dient nur dazu, den Download zu erlauben und Missbrauch zu begrenzen.", "s5t": "5. Feedback, das du sendest", "s5b": "Wenn du in der App Feedback sendest, erhalten wir deinen Text, die freiwillig angegebene Kontaktangabe, bis zu drei angehängte Bilder und einige automatisch ergänzte technische Angaben: App-Version, iOS-Version, Gerätemodell und Spracheinstellung. Wir verwenden sie nur, um Probleme zu verstehen und zu beheben und dir zu antworten. Bitte gib keine sensiblen Informationen an. Du kannst die Löschung einer gesendeten Nachricht verlangen.", "s6t": "6. Lesen und Vorlesen", "s6b": "Geladene Bücher werden aus Dateien auf deinem Gerät angezeigt. Das Vorlesen nutzt die in iOS eingebauten Stimmen direkt auf dem Gerät; der Text wird nirgendwohin gesendet, und die App nimmt kein Audio auf.", "s7t": "7. Suche nach Updates", "s7b": "Um dich auf neuere Versionen hinzuweisen, kann die App den öffentlichen Abfragedienst des App Store von Apple aufrufen. Gesendet wird nur die Store-Nummer der App – nichts über dich.", "s8t": "8. Aufbewahrung und Löschung", "s8b": "Daten auf deinem Gerät werden gelöscht, wenn du die App entfernst. Feedback bewahren wir nur so lange auf, wie wir es zur Bearbeitung brauchen; auf Wunsch löschen wir es früher. Server-Zugriffsprotokolle dienen nur dem Betrieb und der Absicherung des Dienstes.", "s9t": "9. Datenschutz für Kinder", "s9b": "Die App ist zum gemeinsamen Lesen in der Familie gedacht und erhebt nicht wissentlich personenbezogene Daten von Kindern unter 13 Jahren. Das Feedback-Formular richtet sich an Eltern und Erziehungsberechtigte.", "s10t": "10. Dienste Dritter", "s10b": "Die App nutzt Dienste von Apple (App Store und StoreKit) für Käufe und die Update-Suche. Ihre Leseengine ist in die App eingebundene Open-Source-Software (three.js) und läuft vollständig auf deinem Gerät. Wir geben keine Informationen an Werbetreibende oder Datenhändler weiter.", "s11t": "11. Änderungen dieser Erklärung", "s11b": "Wenn sich diese Erklärung ändert, veröffentlichen wir die neue Fassung auf dieser Seite und passen das Datum an.", "s12t": "12. Kontakt", "s12b": "Bei Fragen zu dieser Erklärung wende dich an:"}, "fr": {"title": "Politique de confidentialité", "eff": "Date d’entrée en vigueur : 4 novembre 2026", "back": "DreamBook", "intro": "DreamBook (« l’App ») est une application de livres pop-up à lire en famille. Il n’y a aucun compte à créer, et nous ne collectons aucune information personnelle sur vous ni sur votre enfant. Cette politique explique précisément ce que l’App fait de vos informations.", "s1t": "1. Informations que nous ne collectons pas", "s1b": "L’App n’a ni inscription ni connexion. Elle ne collecte ni votre nom, ni votre adresse e-mail, ni votre position, ni vos contacts, vos photos ou l’audio du micro, et ne contient ni publicité ni outil d’analyse ou de suivi tiers.", "s2t": "2. Ce qui reste sur votre appareil", "s2b": "Votre historique de lecture, les vues enregistrées, l’étagère, les réglages de langue et d’apparence ainsi que les livres téléchargés ne sont stockés que sur cet appareil. Ils ne nous sont pas envoyés. Supprimer l’App les supprime.", "s3t": "3. Notre serveur de bibliothèque", "s3b": "Pour afficher la bibliothèque et télécharger des livres, l’App contacte notre serveur : elle demande la liste des livres, les couvertures et les fichiers des livres. Aucun compte ni identifiant personnel n’est envoyé. Comme pour toute requête internet, le serveur reçoit votre adresse IP et des informations techniques de base dans ses journaux d’accès habituels, que nous utilisons uniquement pour faire fonctionner le service et le protéger contre les abus (par exemple en limitant le nombre de requêtes).", "s4t": "4. Achats et livres Pro", "s4b": "Les achats sont traités par Apple via l’App Store ; votre moyen de paiement et les données de votre compte Apple ne nous sont jamais visibles. Pour télécharger un livre qui exige Pro, l’App envoie à notre serveur le justificatif de votre transaction Pro signé par Apple, que le serveur vérifie lui-même. Il ne contient que des informations de transaction — ni votre nom, ni votre e-mail, ni votre moyen de paiement — et sert uniquement à autoriser le téléchargement et à limiter les abus.", "s5t": "5. Les avis que vous envoyez", "s5b": "Si vous envoyez un avis depuis l’App, nous recevons le texte que vous avez écrit, le contact que vous avez saisi (facultatif), jusqu’à trois images jointes et quelques informations techniques ajoutées automatiquement : version de l’App, version d’iOS, modèle de l’appareil et réglage de langue. Nous ne les utilisons que pour comprendre et corriger les problèmes et vous répondre. N’y mettez pas d’informations sensibles. Vous pouvez nous demander de supprimer un message envoyé.", "s6t": "6. Lecture et lecture à voix haute", "s6b": "Les livres téléchargés s’affichent à partir de fichiers stockés sur votre appareil. La lecture à voix haute utilise les voix intégrées à iOS, sur l’appareil lui-même ; le texte n’est envoyé nulle part et l’App n’enregistre aucun son.", "s7t": "7. Recherche de mises à jour", "s7b": "Pour vous signaler une version plus récente, l’App peut interroger le service public de recherche de l’App Store d’Apple. Seul le numéro de l’App sur le store est envoyé — rien sur vous.", "s8t": "8. Conservation et suppression des données", "s8b": "Les données de votre appareil sont supprimées lorsque vous supprimez l’App. Les avis ne sont conservés que le temps nécessaire pour traiter votre message ; écrivez-nous et nous les supprimerons plus tôt. Les journaux d’accès du serveur servent uniquement à exploiter et sécuriser le service.", "s9t": "9. Confidentialité des enfants", "s9b": "L’App est conçue pour une lecture en famille et ne collecte pas sciemment d’informations personnelles auprès d’enfants de moins de 13 ans. Le formulaire d’avis s’adresse aux parents et tuteurs.", "s10t": "10. Services tiers", "s10b": "L’App utilise les services d’Apple (App Store et StoreKit) pour les achats et la recherche de mises à jour. Son moteur de lecture est un logiciel libre (three.js) intégré à l’App, qui fonctionne entièrement sur votre appareil. Nous ne partageons aucune information avec des annonceurs ni des courtiers en données.", "s11t": "11. Modifications de cette politique", "s11b": "Si cette politique change, la nouvelle version sera publiée sur cette page et la date d’entrée en vigueur sera mise à jour.", "s12t": "12. Nous contacter", "s12b": "Pour toute question sur cette politique, contactez :"}, "es": {"title": "Política de privacidad", "eff": "Fecha de entrada en vigor: 4 de noviembre de 2026", "back": "DreamBook", "intro": "DreamBook («la App») es una aplicación de libros desplegables para leer en familia. No hay que crear ninguna cuenta y no recopilamos información personal tuya ni de tu hijo o hija. Esta política explica con exactitud qué hace la App con tu información.", "s1t": "1. Información que no recopilamos", "s1b": "La App no tiene registro ni inicio de sesión. No recopila tu nombre, correo electrónico, ubicación, contactos, fotos ni audio del micrófono, y no contiene publicidad ni analítica o seguimiento de terceros.", "s2t": "2. Lo que se queda en tu dispositivo", "s2b": "Tu historial de lectura, las vistas guardadas, la estantería, los ajustes de idioma y apariencia y los libros descargados se guardan solo en este dispositivo. No se suben a nuestros servidores. Al eliminar la App se eliminan también.", "s3t": "3. Nuestro servidor de la biblioteca", "s3b": "Para mostrar la biblioteca y descargar libros, la App se conecta a nuestro servidor: pide la lista de libros, las portadas y los archivos de los libros. No se envía ninguna cuenta ni identificador personal. Como en cualquier petición de internet, el servidor recibe tu dirección IP y datos técnicos básicos en sus registros de acceso habituales, que usamos solo para hacer funcionar el servicio y protegerlo de abusos (por ejemplo, limitando el número de peticiones).", "s4t": "4. Compras y libros Pro", "s4b": "Apple procesa las compras a través de la App Store; nunca vemos tu método de pago ni los datos de tu ID de Apple. Para descargar un libro que requiere Pro, la App envía a nuestro servidor el registro de tu transacción Pro firmado por Apple, que el servidor verifica por sí mismo. Solo contiene datos de la transacción —no tu nombre, correo ni método de pago— y se usa únicamente para decidir si se permite la descarga y para limitar abusos.", "s5t": "5. Comentarios que envías", "s5b": "Si envías comentarios desde la App, recibimos lo que escribas, el dato de contacto opcional que indiques, hasta tres imágenes adjuntas y algunos datos técnicos añadidos automáticamente: versión de la App, versión de iOS, modelo del dispositivo y ajuste de idioma. Los usamos solo para entender y resolver problemas y para responderte. Por favor, no incluyas información sensible. Puedes pedirnos que eliminemos un mensaje que hayas enviado.", "s6t": "6. Lectura y lectura en voz alta", "s6b": "Los libros descargados se muestran a partir de archivos guardados en tu dispositivo. La lectura en voz alta usa las voces integradas de iOS, en el propio dispositivo; el texto no se envía a ninguna parte y la App no graba audio.", "s7t": "7. Búsqueda de actualizaciones", "s7b": "Para avisarte de que hay una versión más reciente, la App puede consultar el servicio público de búsqueda de la App Store de Apple. Solo se envía el número de la App en la tienda; nada sobre ti.", "s8t": "8. Conservación y eliminación de datos", "s8b": "Los datos de tu dispositivo se eliminan al borrar la App. Los comentarios se conservan solo el tiempo necesario para atender tu mensaje; escríbenos y los eliminaremos antes si lo pides. Los registros de acceso del servidor se usan solo para operar y proteger el servicio.", "s9t": "9. Privacidad de los niños", "s9b": "La App está pensada para leer en familia y no recopila a sabiendas información personal de menores de 13 años. El formulario de comentarios está dirigido a padres y tutores.", "s10t": "10. Servicios de terceros", "s10b": "La App usa servicios de Apple (App Store y StoreKit) para las compras y la búsqueda de actualizaciones. Su motor de lectura es software de código abierto (three.js) incluido en la App, que funciona por completo en tu dispositivo. No compartimos información con anunciantes ni intermediarios de datos.", "s11t": "11. Cambios en esta política", "s11b": "Si esta política cambia, publicaremos la versión actualizada en esta página y revisaremos la fecha de entrada en vigor.", "s12t": "12. Contacto", "s12b": "Si tienes preguntas sobre esta política, contacta con:"}, "it": {"title": "Informativa sulla privacy", "eff": "In vigore dal: 4 novembre 2026", "back": "DreamBook", "intro": "DreamBook («l’App») è un’app di libri pop-up da leggere in famiglia. Non c’è alcun account da creare e non raccogliamo informazioni personali su di te o su tuo figlio. Questa informativa spiega con precisione cosa fa l’App con le tue informazioni.", "s1t": "1. Informazioni che non raccogliamo", "s1b": "L’App non ha registrazione né accesso. Non raccoglie nome, indirizzo e-mail, posizione, contatti, foto o audio del microfono, e non contiene pubblicità né strumenti di analisi o tracciamento di terzi.", "s2t": "2. Cosa resta sul tuo dispositivo", "s2b": "La cronologia di lettura, le viste salvate, lo scaffale, le impostazioni di lingua e aspetto e i libri scaricati sono memorizzati solo su questo dispositivo. Non vengono inviati a noi. Eliminando l’App vengono eliminati anche loro.", "s3t": "3. Il nostro server della libreria", "s3b": "Per mostrare la libreria e scaricare i libri, l’App contatta il nostro server: richiede l’elenco dei libri, le copertine e i file dei libri. Non viene inviato alcun account né identificatore personale. Come per qualsiasi richiesta internet, il server riceve il tuo indirizzo IP e informazioni tecniche di base nei normali registri di accesso, che usiamo solo per far funzionare il servizio e proteggerlo dagli abusi (ad esempio limitando il numero di richieste).", "s4t": "4. Acquisti e libri Pro", "s4b": "Gli acquisti sono elaborati da Apple tramite l’App Store; il tuo metodo di pagamento e i dati dell’ID Apple non sono mai visibili a noi. Per scaricare un libro che richiede Pro, l’App invia al nostro server la registrazione della tua transazione Pro firmata da Apple, che il server verifica da sé. Contiene solo dati della transazione — non il tuo nome, la tua e-mail o il metodo di pagamento — e serve solo a decidere se il download è consentito e a limitare gli abusi.", "s5t": "5. I feedback che invii", "s5b": "Se invii un feedback dall’App, riceviamo il testo che scrivi, il contatto facoltativo che indichi, fino a tre immagini allegate e alcuni dati tecnici aggiunti automaticamente: versione dell’App, versione di iOS, modello del dispositivo e impostazione della lingua. Li usiamo solo per capire e risolvere i problemi e per risponderti. Non includere informazioni sensibili. Puoi chiederci di eliminare un messaggio che hai inviato.", "s6t": "6. Lettura e lettura ad alta voce", "s6b": "I libri scaricati vengono mostrati a partire da file memorizzati sul tuo dispositivo. La lettura ad alta voce usa le voci integrate in iOS, sul dispositivo stesso; il testo non viene inviato da nessuna parte e l’App non registra audio.", "s7t": "7. Ricerca di aggiornamenti", "s7b": "Per avvisarti quando c’è una versione più recente, l’App può interrogare il servizio pubblico di ricerca dell’App Store di Apple. Viene inviato solo il numero dell’App sullo store — nulla su di te.", "s8t": "8. Conservazione ed eliminazione dei dati", "s8b": "I dati sul dispositivo vengono eliminati quando rimuovi l’App. I feedback sono conservati solo per il tempo necessario a gestire il tuo messaggio; scrivici e li elimineremo prima, se lo richiedi. I registri di accesso del server servono solo a gestire e proteggere il servizio.", "s9t": "9. Privacy dei minori", "s9b": "L’App è pensata per la lettura in famiglia e non raccoglie consapevolmente informazioni personali da minori di 13 anni. Il modulo di feedback è rivolto a genitori e tutori.", "s10t": "10. Servizi di terze parti", "s10b": "L’App usa i servizi di Apple (App Store e StoreKit) per gli acquisti e la ricerca di aggiornamenti. Il suo motore di lettura è software open source (three.js) incluso nell’App e funziona interamente sul tuo dispositivo. Non condividiamo informazioni con inserzionisti o intermediari di dati.", "s11t": "11. Modifiche a questa informativa", "s11b": "Se questa informativa cambia, la versione aggiornata sarà pubblicata in questa pagina e la data di entrata in vigore sarà rivista.", "s12t": "12. Contattaci", "s12b": "Per qualsiasi domanda su questa informativa, contatta:"}, "pt-BR": {"title": "Política de Privacidade", "eff": "Data de vigência: 4 de novembro de 2026", "back": "DreamBook", "intro": "O DreamBook (“o App”) é um app de livros pop-up para ler em família. Não há conta a criar e não coletamos informações pessoais sobre você ou seu filho. Esta política explica exatamente o que o App faz com as suas informações.", "s1t": "1. Informações que não coletamos", "s1b": "O App não tem cadastro nem login. Ele não coleta seu nome, e-mail, localização, contatos, fotos ou áudio do microfone, e não contém publicidade nem análise ou rastreamento de terceiros.", "s2t": "2. O que fica no seu aparelho", "s2b": "Seu histórico de leitura, as vistas salvas, a estante, os ajustes de idioma e aparência e os livros baixados ficam armazenados apenas neste aparelho. Nada disso é enviado para nós. Ao remover o App, tudo é removido.", "s3t": "3. Nosso servidor da biblioteca", "s3b": "Para mostrar a biblioteca e baixar livros, o App se conecta ao nosso servidor: pede a lista de livros, as capas e os arquivos dos livros. Nenhuma conta nem identificador pessoal é enviado. Como em qualquer requisição de internet, o servidor recebe seu endereço IP e informações técnicas básicas nos registros de acesso comuns, que usamos apenas para operar o serviço e protegê-lo contra abuso (por exemplo, limitando o número de requisições).", "s4t": "4. Compras e livros Pro", "s4b": "As compras são processadas pela Apple por meio da App Store; seu meio de pagamento e os dados do seu ID Apple nunca são visíveis para nós. Para baixar um livro que exige Pro, o App envia ao nosso servidor o registro da sua transação Pro assinado pela Apple, que o servidor verifica por conta própria. Ele contém apenas dados da transação — não seu nome, e-mail ou meio de pagamento — e serve só para decidir se o download é permitido e limitar abusos.", "s5t": "5. Sugestões que você envia", "s5b": "Se você enviar sugestões pelo App, recebemos o que você escrever, o contato opcional que informar, até três imagens anexadas e alguns dados técnicos adicionados automaticamente: versão do App, versão do iOS, modelo do aparelho e ajuste de idioma. Usamos esses dados apenas para entender e corrigir problemas e para responder a você. Não inclua informações sensíveis. Você pode pedir que apaguemos uma mensagem enviada.", "s6t": "6. Leitura e leitura em voz alta", "s6b": "Os livros baixados são exibidos a partir de arquivos armazenados no seu aparelho. A leitura em voz alta usa as vozes integradas do iOS, no próprio aparelho; o texto não é enviado a lugar nenhum e o App não grava áudio.", "s7t": "7. Verificação de atualizações", "s7b": "Para avisar quando houver uma versão mais nova, o App pode consultar o serviço público de busca da App Store da Apple. Só o número do App na loja é enviado — nada sobre você.", "s8t": "8. Guarda e exclusão dos dados", "s8b": "Os dados do seu aparelho são excluídos quando você remove o App. As sugestões são guardadas apenas pelo tempo necessário para tratar sua mensagem; escreva para nós e as apagaremos antes, se você pedir. Os registros de acesso do servidor são usados apenas para operar e proteger o serviço.", "s9t": "9. Privacidade de crianças", "s9b": "O App foi feito para leitura em família e não coleta intencionalmente informações pessoais de crianças menores de 13 anos. O formulário de sugestões é destinado a pais e responsáveis.", "s10t": "10. Serviços de terceiros", "s10b": "O App usa serviços da Apple (App Store e StoreKit) para compras e verificação de atualizações. Seu mecanismo de leitura é um software de código aberto (three.js) incluído no App e funciona inteiramente no seu aparelho. Não compartilhamos informações com anunciantes nem corretores de dados.", "s11t": "11. Alterações nesta política", "s11b": "Se esta política mudar, a versão atualizada será publicada nesta página e a data de vigência será revisada.", "s12t": "12. Fale conosco", "s12b": "Se tiver dúvidas sobre esta política, entre em contato:"}, "ru": {"title": "Политика конфиденциальности", "eff": "Дата вступления в силу: 4 ноября 2026 г.", "back": "DreamBook", "intro": "DreamBook («Приложение») — приложение с объёмными сказками для семейного чтения. Создавать учётную запись не нужно, и мы не собираем персональные данные ни о вас, ни о вашем ребёнке. Эта политика точно объясняет, что Приложение делает с вашей информацией.", "s1t": "1. Какие данные мы не собираем", "s1b": "В Приложении нет регистрации и входа. Оно не собирает ваше имя, адрес электронной почты, местоположение, контакты, фотографии и звук с микрофона, не содержит рекламы и не использует сторонние средства аналитики или отслеживания.", "s2t": "2. Что остаётся на вашем устройстве", "s2b": "История чтения, сохранённые ракурсы, книжная полка, настройки языка и оформления и скачанные книги хранятся только на этом устройстве. Нам они не передаются. При удалении Приложения они удаляются вместе с ним.", "s3t": "3. Наш сервер библиотеки", "s3b": "Чтобы показать библиотеку и скачать книги, Приложение обращается к нашему серверу: запрашивает список книг, обложки и файлы книг. Никакая учётная запись и никакой личный идентификатор не передаются. Как при любом интернет-запросе, сервер получает ваш IP-адрес и базовые технические сведения в обычных журналах доступа; мы используем их только для работы сервиса и защиты от злоупотреблений (например, ограничения частоты запросов).", "s4t": "4. Покупки и книги Pro", "s4b": "Покупки проводит Apple через App Store; способ оплаты и данные вашей учётной записи Apple нам не видны. Чтобы скачать книгу, требующую Pro, Приложение отправляет нашему серверу подписанную Apple запись о вашей транзакции Pro, которую сервер проверяет самостоятельно. В ней только сведения о транзакции — без вашего имени, электронной почты и способа оплаты, — и используется она лишь для решения, разрешить ли скачивание, и для ограничения злоупотреблений.", "s5t": "5. Отзывы, которые вы отправляете", "s5b": "Если вы отправляете отзыв из Приложения, мы получаем написанный вами текст, необязательный контакт, который вы указали, до трёх приложенных изображений и несколько технических сведений, добавляемых автоматически: версию Приложения, версию iOS, модель устройства и настройку языка. Мы используем их только чтобы разобраться в проблемах, исправить их и ответить вам. Пожалуйста, не включайте конфиденциальную информацию. Вы можете попросить нас удалить отправленное сообщение.", "s6t": "6. Чтение и озвучка", "s6b": "Скачанные книги отображаются из файлов, хранящихся на вашем устройстве. Озвучка использует встроенные в iOS голоса прямо на устройстве; текст никуда не отправляется, а Приложение не записывает звук.", "s7t": "7. Проверка обновлений", "s7b": "Чтобы сообщить о выходе новой версии, Приложение может обращаться к общедоступной службе поиска App Store от Apple. Передаётся только номер Приложения в магазине — ничего о вас.", "s8t": "8. Хранение и удаление данных", "s8b": "Данные на вашем устройстве удаляются при удалении Приложения. Отзывы хранятся только столько, сколько нужно для обработки вашего сообщения; напишите нам, и мы удалим их раньше. Журналы доступа сервера используются только для работы и защиты сервиса.", "s9t": "9. Конфиденциальность детей", "s9b": "Приложение рассчитано на семейное чтение и намеренно не собирает персональные данные детей младше 13 лет. Форма отзыва предназначена для родителей и опекунов.", "s10t": "10. Сторонние сервисы", "s10b": "Для покупок и проверки обновлений Приложение использует сервисы Apple (App Store и StoreKit). Его движок чтения — программное обеспечение с открытым кодом (three.js), встроенное в Приложение и работающее целиком на вашем устройстве. Мы не передаём информацию рекламодателям и брокерам данных.", "s11t": "11. Изменения этой политики", "s11b": "Если политика изменится, обновлённая версия будет опубликована на этой странице, а дата вступления в силу — исправлена.", "s12t": "12. Связаться с нами", "s12b": "Если у вас есть вопросы об этой политике, напишите:"}};
    const SUP = ["en", "zh-Hans", "zh-Hant", "ja", "ko", "de", "fr", "es", "it", "pt-BR", "ru"];
    function norm(p){p=p.toLowerCase();
      if(p.startsWith('zh')) return (p.includes('hant')||p.includes('tw')||p.includes('hk'))?'zh-Hant':'zh-Hans';
      if(p.startsWith('pt')) return 'pt-BR';
      const b=p.slice(0,2), m={en:'en',ja:'ja',ko:'ko',de:'de',fr:'fr',es:'es',it:'it',ru:'ru'};
      return m[b]||null;}
    function detect(){
      const h=(location.hash.match(/lang=([\w-]+)/)||[])[1];
      if(h&&I18N[h]) return h;
      for(const p of (navigator.languages||[navigator.language||'en'])){const n=norm(p); if(n&&I18N[n]) return n;}
      return 'en';}
    function apply(lang){
      const d=I18N[lang]||I18N.en;
      document.documentElement.lang=lang;
      document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=d[el.dataset.i18n]||'';});
      const sel=document.getElementById('lang'); if(sel) sel.value=lang;
      history.replaceState(null,'','#lang='+lang);}
    const sel=document.getElementById('lang');
    if(sel) sel.addEventListener('change',e=>apply(e.target.value));
    apply(detect());
  </script>
