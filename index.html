<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DreamBook · Support</title>
  <style>
    :root{--bg:#fff;--card:#f3f6fc;--label:#1d1d1f;--label-2:#6e6e73;--tint:#2F6DF0;--border:rgba(0,0,0,.08)}
    @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--label:#f5f5f7;--label-2:#98989d;--tint:#6AAEFF;--border:rgba(255,255,255,.12)}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
    .wrap{max-width:680px;margin:0 auto;padding:20px 20px 80px}
    .lang-bar{text-align:right;padding:12px 0 4px}
    select{font:inherit;color:var(--label);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
    header{text-align:center;margin:24px 0 44px}
    .logo{width:84px;height:84px;border-radius:20px;margin-bottom:16px;object-fit:cover;box-shadow:0 4px 16px rgba(0,0,0,.12)}
    h1{font-size:30px;margin:8px 0 4px;letter-spacing:-.02em}
    .tagline{color:var(--label-2);font-size:16px;margin:0}
    h2{font-size:20px;margin:40px 0 12px;letter-spacing:-.01em}
    p{margin:0 0 12px}
    .muted{color:var(--label-2);font-size:15px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin:16px 0}
    a{color:var(--tint);text-decoration:none}
    a:hover{text-decoration:underline}
    .contact-btn{display:inline-block;background:var(--tint);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;margin-top:8px;min-height:44px;line-height:20px}
    @media (prefers-color-scheme:dark){.contact-btn{color:#000}}
    .contact-btn:hover{text-decoration:none;opacity:.9}
    footer{text-align:center;color:var(--label-2);font-size:13px;margin-top:48px}
    .back{display:inline-block;margin:8px 0 20px;font-size:15px}
    .eff{color:var(--label-2);font-size:14px;margin:0 0 24px}
  </style>
</head>

  <script>
    const I18N = {"en": {"app_name": "DreamBook", "tagline": "Pop-up fairy tales that read aloud", "support_h": "Support & Help", "support_p": "Thanks for reading with DreamBook. If something isn’t working, you have an idea, or you just need a hand, write to us — every email is read by a person. You can also send feedback, with screenshots, from Settings inside the app.", "contact_label": "Contact", "contact_btn": "Email us", "faq_h": "FAQ", "faq1_q": "What’s free, and what does Pro unlock?", "faq1_a": "Some books are free to read, with no sign-up and no purchase. DreamBook Pro unlocks the whole library, including books added later. The available plans and prices are shown on the Pro page in the app.", "faq2_q": "How do I restore my purchase on a new device?", "faq2_a": "Sign in with the same Apple Account, open the Pro page in the app and tap “Restore Purchases”. Nothing has to be created with us — your purchase is tied to your Apple Account.", "faq3_q": "How do I cancel a subscription or ask for a refund?", "faq3_a": "Subscriptions are managed by Apple: open iOS Settings → your name → Subscriptions → DreamBook, and cancel at least 24 hours before the renewal date. Refunds are handled by Apple at reportaproblem.apple.com.", "faq4_q": "A book won’t download, or the library is empty.", "faq4_a": "Books are downloaded from our server, so you need an internet connection. Check your connection and try again; if you see a “too many requests” message, wait a minute. Books you have already downloaded can be read offline. If it keeps failing, email us with the book’s name.", "faq5_q": "The read-aloud voice is silent or sounds odd.", "faq5_a": "Read-aloud uses the voice built into iOS, on your device. Check the volume, and download a better voice in iOS Settings → Accessibility → Spoken Content → Voices. If it’s still silent, email us with your iOS version.", "faq6_q": "Do you collect information about my child?", "faq6_a": "No account is needed and we don’t collect names, emails or locations. There are no ads and no third-party tracking. The app only talks to our server to list and download books and, if you choose, to send feedback. The details are in the privacy policy below.", "privacy_link": "Privacy Policy"}, "zh-Hans": {"app_name": "梦幻绘本", "tagline": "会朗读的睡前童话立体书", "support_h": "支持与帮助", "support_p": "感谢你和孩子一起阅读梦幻绘本。使用中遇到问题、有什么想法，或者只是想说点什么，都欢迎写信给我们 —— 每一封都有人看。你也可以在 App 的「设置」里直接提交意见反馈，还能附上截图。", "contact_label": "联系邮箱", "contact_btn": "发送邮件", "faq_h": "常见问题", "faq1_q": "免费能看什么？Pro 解锁什么？", "faq1_a": "部分书免费阅读，不用注册，也不用购买。梦幻绘本 Pro 解锁全部书库，包括之后上架的新书。具体方案与价格请看 App 里的 Pro 页面。", "faq2_q": "换了新设备，怎么恢复已购买的内容？", "faq2_a": "登录同一个 Apple 账户，在 App 里打开 Pro 页面，点「恢复购买」即可。不需要在我们这里创建任何账号 —— 你的购买绑定在你的 Apple 账户上。", "faq3_q": "怎么取消订阅，或者申请退款？", "faq3_a": "订阅由 Apple 管理：打开 iOS「设置」→ 点你的名字 →「订阅」→ 梦幻绘本，在续费日前至少 24 小时取消。退款由 Apple 处理，请前往 reportaproblem.apple.com。", "faq4_q": "书下载不下来，或者书库是空的。", "faq4_a": "书是从我们的服务器下载的，需要联网。请检查网络后重试；如果提示「请求太频繁」，等一分钟再试。已经下载过的书可以离线阅读。仍然不行，请写信告诉我们是哪本书。", "faq5_q": "朗读没有声音，或者声音怪怪的。", "faq5_a": "朗读用的是 iOS 自带的语音，在你的设备上合成。请先检查音量，也可以在 iOS「设置 → 辅助功能 → 朗读内容 → 声音」里下载更好听的声音。仍然没声音，请写信并告诉我们你的 iOS 版本。", "faq6_q": "你们会收集我孩子的信息吗？", "faq6_a": "不需要账号，我们也不收集姓名、邮箱或位置。没有广告，也没有第三方追踪。App 只在列出与下载书、以及你主动发送反馈时才和我们的服务器通信。细节见下面的隐私政策。", "privacy_link": "隐私政策"}, "zh-Hant": {"app_name": "夢幻繪本", "tagline": "會朗讀的睡前童話立體書", "support_h": "支援與說明", "support_p": "感謝你和孩子一起閱讀夢幻繪本。使用中遇到問題、有什麼想法，或者只是想說點什麼，都歡迎寫信給我們 —— 每一封都有人看。你也可以在 App 的「設定」裡直接提交意見回饋，還能附上截圖。", "contact_label": "聯絡信箱", "contact_btn": "寄送郵件", "faq_h": "常見問題", "faq1_q": "免費能看什麼？Pro 解鎖什麼？", "faq1_a": "部分書免費閱讀，不用註冊，也不用購買。夢幻繪本 Pro 解鎖全部書庫，包括之後上架的新書。具體方案與價格請看 App 裡的 Pro 頁面。", "faq2_q": "換了新裝置，怎麼回復已購買的內容？", "faq2_a": "登入同一個 Apple 帳號，在 App 裡開啟 Pro 頁面，點「回復購買」即可。不需要在我們這裡建立任何帳號 —— 你的購買綁定在你的 Apple 帳號上。", "faq3_q": "怎麼取消訂閱，或者申請退款？", "faq3_a": "訂閱由 Apple 管理：開啟 iOS「設定」→ 點你的名字 →「訂閱」→ 夢幻繪本，在續訂日前至少 24 小時取消。退款由 Apple 處理，請前往 reportaproblem.apple.com。", "faq4_q": "書下載不下來，或者書庫是空的。", "faq4_a": "書是從我們的伺服器下載的，需要連網。請檢查網路後重試；如果提示「請求太頻繁」，等一分鐘再試。已經下載過的書可以離線閱讀。仍然不行，請寫信告訴我們是哪一本書。", "faq5_q": "朗讀沒有聲音，或者聲音怪怪的。", "faq5_a": "朗讀用的是 iOS 內建的語音，在你的裝置上合成。請先檢查音量，也可以在 iOS「設定 → 輔助使用 → 語音內容 → 聲音」裡下載更好聽的聲音。仍然沒聲音，請寫信並告訴我們你的 iOS 版本。", "faq6_q": "你們會蒐集我孩子的資訊嗎？", "faq6_a": "不需要帳號，我們也不蒐集姓名、電子郵件或位置。沒有廣告，也沒有第三方追蹤。App 只在列出與下載書、以及你主動傳送意見回饋時才和我們的伺服器通訊。細節見下面的隱私權政策。", "privacy_link": "隱私權政策"}, "ja": {"app_name": "DreamBook", "tagline": "読み聞かせてくれる飛び出す童話", "support_h": "サポートとヘルプ", "support_p": "DreamBook をご利用いただきありがとうございます。うまく動かないとき、ご要望があるとき、困ったときは、お気軽にメールをお送りください。すべてのメールを人間が読んでいます。アプリの「設定」から、スクリーンショット付きでご意見を送ることもできます。", "contact_label": "連絡先", "contact_btn": "メールを送る", "faq_h": "よくある質問", "faq1_q": "無料で読める本は？ Pro で何が使えますか？", "faq1_a": "一部の本は登録も購入も不要で無料で読めます。DreamBook Pro では、今後追加される本も含めてライブラリ全体が読めるようになります。プランと価格はアプリの Pro 画面に表示されます。", "faq2_q": "新しい端末で購入内容を復元するには？", "faq2_a": "同じ Apple アカウントでサインインし、アプリの Pro 画面で「購入を復元」をタップしてください。こちらでアカウントを作る必要はありません。購入は Apple アカウントに紐づいています。", "faq3_q": "サブスクリプションの解約や返金は？", "faq3_a": "サブスクリプションは Apple が管理しています。iOS の「設定」→ 自分の名前 →「サブスクリプション」→ DreamBook を開き、更新日の 24 時間以上前に解約してください。返金は Apple（reportaproblem.apple.com）が対応します。", "faq4_q": "本がダウンロードできない、またはライブラリが空です。", "faq4_a": "本は当社のサーバーからダウンロードするため、インターネット接続が必要です。接続を確認して再試行してください。「リクエストが多すぎます」と出たら、1 分ほど待ってください。ダウンロード済みの本はオフラインでも読めます。解決しない場合は、本の名前を添えてメールでご連絡ください。", "faq5_q": "読み上げの音が出ない、または不自然です。", "faq5_a": "読み上げは iOS 内蔵の音声を端末上で使っています。音量を確認し、iOS の「設定 → アクセシビリティ → 読み上げコンテンツ → 声」でより良い声をダウンロードしてみてください。それでも音が出ない場合は、iOS のバージョンを添えてメールでご連絡ください。", "faq6_q": "お子さまの情報を収集しますか？", "faq6_a": "アカウントは不要で、氏名・メールアドレス・位置情報は収集しません。広告も第三者の追跡もありません。アプリが当社のサーバーと通信するのは、本の一覧表示とダウンロード、そしてご自身で送信するご意見のときだけです。詳しくは下のプライバシーポリシーをご覧ください。", "privacy_link": "プライバシーポリシー"}, "ko": {"app_name": "DreamBook", "tagline": "읽어 주는 팝업 동화책", "support_h": "지원 및 도움말", "support_p": "DreamBook을 이용해 주셔서 감사합니다. 작동이 이상하거나, 바라는 기능이 있거나, 도움이 필요하시면 언제든 메일을 보내 주세요. 모든 메일은 사람이 읽습니다. 앱의 ‘설정’에서 스크린샷과 함께 의견을 보낼 수도 있습니다.", "contact_label": "문의처", "contact_btn": "메일 보내기", "faq_h": "자주 묻는 질문", "faq1_q": "무료로 볼 수 있는 책은? Pro로 무엇이 열리나요?", "faq1_a": "일부 책은 가입이나 구매 없이 무료로 읽을 수 있습니다. DreamBook Pro는 이후에 추가되는 책을 포함해 전체 서재를 열어 줍니다. 요금제와 가격은 앱의 Pro 화면에서 확인할 수 있습니다.", "faq2_q": "새 기기에서 구매 내역을 복원하려면?", "faq2_a": "같은 Apple 계정으로 로그인한 뒤 앱의 Pro 화면에서 ‘구매 복원’을 누르세요. 저희 쪽에 계정을 만들 필요는 없습니다. 구매는 Apple 계정에 연결되어 있습니다.", "faq3_q": "구독을 해지하거나 환불을 받으려면?", "faq3_a": "구독은 Apple에서 관리합니다. iOS ‘설정’ → 내 이름 → ‘구독’ → DreamBook에서 갱신일 최소 24시간 전에 해지하세요. 환불은 Apple(reportaproblem.apple.com)에서 처리합니다.", "faq4_q": "책이 다운로드되지 않거나 서재가 비어 있어요.", "faq4_a": "책은 저희 서버에서 내려받으므로 인터넷 연결이 필요합니다. 연결을 확인하고 다시 시도하세요. ‘요청이 너무 많습니다’라고 나오면 1분쯤 기다려 주세요. 이미 내려받은 책은 오프라인에서도 읽을 수 있습니다. 계속 안 되면 책 이름과 함께 메일로 알려 주세요.", "faq5_q": "읽어 주는 소리가 나지 않거나 어색해요.", "faq5_a": "읽어 주기는 기기 안에서 iOS 내장 음성으로 이루어집니다. 볼륨을 확인하고, iOS ‘설정 → 손쉬운 사용 → 말하기 콘텐츠 → 음성’에서 더 나은 음성을 내려받아 보세요. 그래도 소리가 나지 않으면 iOS 버전과 함께 메일을 보내 주세요.", "faq6_q": "아이의 정보를 수집하나요?", "faq6_a": "계정이 필요 없으며 이름, 이메일, 위치는 수집하지 않습니다. 광고도, 제3자 추적도 없습니다. 앱은 책 목록을 보고 내려받을 때와 직접 의견을 보낼 때만 저희 서버와 통신합니다. 자세한 내용은 아래 개인정보 처리방침을 확인하세요.", "privacy_link": "개인정보 처리방침"}, "de": {"app_name": "DreamBook", "tagline": "Pop-up-Märchen zum Vorlesen", "support_h": "Support & Hilfe", "support_p": "Danke, dass ihr mit DreamBook lest. Wenn etwas nicht funktioniert, ihr eine Idee habt oder einfach Hilfe braucht, schreibt uns – jede E-Mail wird von einem Menschen gelesen. Feedback mit Screenshots könnt ihr auch direkt in den Einstellungen der App senden.", "contact_label": "Kontakt", "contact_btn": "E-Mail schreiben", "faq_h": "Häufige Fragen", "faq1_q": "Was ist kostenlos, und was schaltet Pro frei?", "faq1_a": "Einige Bücher sind kostenlos lesbar – ohne Anmeldung und ohne Kauf. DreamBook Pro schaltet die ganze Bibliothek frei, auch später hinzukommende Bücher. Die verfügbaren Tarife und Preise zeigt die Pro-Seite in der App.", "faq2_q": "Wie stelle ich meinen Kauf auf einem neuen Gerät wieder her?", "faq2_a": "Mit demselben Apple-Account anmelden, in der App die Pro-Seite öffnen und „Käufe wiederherstellen“ tippen. Bei uns muss nichts angelegt werden – der Kauf hängt an deinem Apple-Account.", "faq3_q": "Wie kündige ich ein Abo oder bitte um Rückerstattung?", "faq3_a": "Abos verwaltet Apple: iOS-Einstellungen → dein Name → Abonnements → DreamBook öffnen und mindestens 24 Stunden vor dem Verlängerungsdatum kündigen. Rückerstattungen übernimmt Apple unter reportaproblem.apple.com.", "faq4_q": "Ein Buch lässt sich nicht laden, oder die Bibliothek ist leer.", "faq4_a": "Bücher werden von unserem Server geladen, du brauchst also eine Internetverbindung. Prüfe die Verbindung und versuche es erneut; bei „zu viele Anfragen“ eine Minute warten. Bereits geladene Bücher lassen sich offline lesen. Wenn es weiter scheitert, schreib uns mit dem Namen des Buchs.", "faq5_q": "Die Vorlesestimme ist stumm oder klingt seltsam.", "faq5_a": "Das Vorlesen nutzt die in iOS eingebaute Stimme, direkt auf deinem Gerät. Prüfe die Lautstärke und lade in iOS-Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen eine bessere Stimme. Bleibt es stumm, schreib uns mit deiner iOS-Version.", "faq6_q": "Erfasst ihr Informationen über mein Kind?", "faq6_a": "Es ist kein Konto nötig, und wir erfassen weder Namen noch E-Mail-Adressen oder Standort. Es gibt keine Werbung und kein Tracking durch Dritte. Die App spricht nur mit unserem Server, um Bücher aufzulisten und zu laden und – wenn du es willst – Feedback zu senden. Details stehen in der Datenschutzerklärung unten.", "privacy_link": "Datenschutzerklärung"}, "fr": {"app_name": "DreamBook", "tagline": "Contes pop-up lus à voix haute", "support_h": "Assistance et aide", "support_p": "Merci de lire avec DreamBook. Si quelque chose ne marche pas, si vous avez une idée ou simplement besoin d’un coup de main, écrivez-nous : chaque e-mail est lu par une personne. Vous pouvez aussi envoyer un avis, avec captures d’écran, depuis les Réglages de l’app.", "contact_label": "Contact", "contact_btn": "Nous écrire", "faq_h": "Questions fréquentes", "faq1_q": "Qu’est-ce qui est gratuit, et que débloque Pro ?", "faq1_a": "Certains livres se lisent gratuitement, sans inscription ni achat. DreamBook Pro débloque toute la bibliothèque, y compris les livres ajoutés plus tard. Les formules et les prix sont affichés sur la page Pro de l’app.", "faq2_q": "Comment restaurer mon achat sur un nouvel appareil ?", "faq2_a": "Connectez-vous avec le même compte Apple, ouvrez la page Pro de l’app et touchez « Restaurer les achats ». Rien n’est à créer chez nous : votre achat est lié à votre compte Apple.", "faq3_q": "Comment résilier un abonnement ou demander un remboursement ?", "faq3_a": "Les abonnements sont gérés par Apple : ouvrez Réglages iOS → votre nom → Abonnements → DreamBook, et résiliez au moins 24 heures avant la date de renouvellement. Les remboursements sont traités par Apple sur reportaproblem.apple.com.", "faq4_q": "Un livre ne se télécharge pas, ou la bibliothèque est vide.", "faq4_a": "Les livres se téléchargent depuis notre serveur ; il faut donc une connexion internet. Vérifiez-la et réessayez ; si « trop de requêtes » s’affiche, patientez une minute. Les livres déjà téléchargés se lisent hors connexion. Si le problème persiste, écrivez-nous avec le nom du livre.", "faq5_q": "La voix de lecture est muette ou sonne bizarrement.", "faq5_a": "La lecture à voix haute utilise la voix intégrée à iOS, sur votre appareil. Vérifiez le volume et téléchargez une meilleure voix dans Réglages iOS → Accessibilité → Contenu énoncé → Voix. Si c’est toujours muet, écrivez-nous en indiquant votre version d’iOS.", "faq6_q": "Collectez-vous des informations sur mon enfant ?", "faq6_a": "Aucun compte n’est nécessaire et nous ne collectons ni nom, ni e-mail, ni position. Pas de publicité, pas de suivi par des tiers. L’app ne communique avec notre serveur que pour lister et télécharger les livres et, si vous le décidez, envoyer un avis. Les détails figurent dans la politique de confidentialité ci-dessous.", "privacy_link": "Politique de confidentialité"}, "es": {"app_name": "DreamBook", "tagline": "Cuentos desplegables que se leen en voz alta", "support_h": "Soporte y ayuda", "support_p": "Gracias por leer con DreamBook. Si algo no funciona, tienes una idea o simplemente necesitas ayuda, escríbenos: cada correo lo lee una persona. También puedes enviar comentarios, con capturas de pantalla, desde Ajustes dentro de la app.", "contact_label": "Contacto", "contact_btn": "Escríbenos", "faq_h": "Preguntas frecuentes", "faq1_q": "¿Qué es gratis y qué desbloquea Pro?", "faq1_a": "Algunos libros se leen gratis, sin registro ni compra. DreamBook Pro desbloquea toda la biblioteca, incluidos los libros que se añadan después. Los planes y precios disponibles aparecen en la página Pro de la app.", "faq2_q": "¿Cómo restauro mi compra en un dispositivo nuevo?", "faq2_a": "Inicia sesión con el mismo ID de Apple, abre la página Pro de la app y toca «Restaurar compras». No hace falta crear nada con nosotros: tu compra está ligada a tu ID de Apple.", "faq3_q": "¿Cómo cancelo una suscripción o pido un reembolso?", "faq3_a": "Apple gestiona las suscripciones: abre Ajustes de iOS → tu nombre → Suscripciones → DreamBook y cancela al menos 24 horas antes de la fecha de renovación. Los reembolsos los tramita Apple en reportaproblem.apple.com.", "faq4_q": "Un libro no se descarga o la biblioteca está vacía.", "faq4_a": "Los libros se descargan de nuestro servidor, así que necesitas conexión a internet. Comprueba la conexión e inténtalo de nuevo; si aparece «demasiadas solicitudes», espera un minuto. Los libros ya descargados se pueden leer sin conexión. Si sigue fallando, escríbenos con el nombre del libro.", "faq5_q": "La voz de lectura no suena o suena rara.", "faq5_a": "La lectura en voz alta usa la voz integrada de iOS, en tu dispositivo. Revisa el volumen y descarga una voz mejor en Ajustes de iOS → Accesibilidad → Contenido leído → Voces. Si sigue sin sonar, escríbenos con tu versión de iOS.", "faq6_q": "¿Recopilan información sobre mi hijo o hija?", "faq6_a": "No hace falta cuenta y no recopilamos nombres, correos ni ubicación. No hay anuncios ni seguimiento de terceros. La app solo se comunica con nuestro servidor para listar y descargar libros y, si tú quieres, para enviar comentarios. Los detalles están en la política de privacidad de abajo.", "privacy_link": "Política de privacidad"}, "it": {"app_name": "DreamBook", "tagline": "Fiabe pop-up da ascoltare", "support_h": "Supporto e assistenza", "support_p": "Grazie per leggere con DreamBook. Se qualcosa non funziona, hai un’idea o ti serve semplicemente una mano, scrivici: ogni e-mail viene letta da una persona. Puoi anche inviare un feedback, con screenshot, dalle Impostazioni dell’app.", "contact_label": "Contatti", "contact_btn": "Scrivici", "faq_h": "Domande frequenti", "faq1_q": "Cosa è gratis e cosa sblocca Pro?", "faq1_a": "Alcuni libri si leggono gratis, senza registrazione né acquisto. DreamBook Pro sblocca tutta la libreria, compresi i libri aggiunti in seguito. Piani e prezzi disponibili sono mostrati nella pagina Pro dell’app.", "faq2_q": "Come ripristino l’acquisto su un nuovo dispositivo?", "faq2_a": "Accedi con lo stesso ID Apple, apri la pagina Pro dell’app e tocca «Ripristina acquisti». Da noi non serve creare nulla: l’acquisto è legato al tuo ID Apple.", "faq3_q": "Come annullo un abbonamento o chiedo un rimborso?", "faq3_a": "Gli abbonamenti sono gestiti da Apple: apri Impostazioni di iOS → il tuo nome → Abbonamenti → DreamBook e annulla almeno 24 ore prima della data di rinnovo. I rimborsi sono gestiti da Apple su reportaproblem.apple.com.", "faq4_q": "Un libro non si scarica o la libreria è vuota.", "faq4_a": "I libri si scaricano dal nostro server, quindi serve una connessione a internet. Controlla la connessione e riprova; se compare «troppe richieste», attendi un minuto. I libri già scaricati si leggono anche offline. Se il problema continua, scrivici indicando il titolo del libro.", "faq5_q": "La voce di lettura è muta o suona strana.", "faq5_a": "La lettura ad alta voce usa la voce integrata in iOS, sul tuo dispositivo. Controlla il volume e scarica una voce migliore in Impostazioni di iOS → Accessibilità → Contenuto letto → Voci. Se resta muta, scrivici indicando la tua versione di iOS.", "faq6_q": "Raccogliete informazioni su mio figlio?", "faq6_a": "Non serve alcun account e non raccogliamo nomi, e-mail o posizione. Nessuna pubblicità e nessun tracciamento di terzi. L’app comunica con il nostro server solo per elencare e scaricare i libri e, se lo scegli tu, per inviare un feedback. I dettagli sono nell’informativa sulla privacy qui sotto.", "privacy_link": "Informativa sulla privacy"}, "pt-BR": {"app_name": "DreamBook", "tagline": "Contos pop-up que se leem em voz alta", "support_h": "Suporte e ajuda", "support_p": "Obrigado por ler com o DreamBook. Se algo não estiver funcionando, se você tiver uma ideia ou só precisar de uma mão, escreva para nós: cada e-mail é lido por uma pessoa. Você também pode enviar sugestões, com capturas de tela, em Ajustes dentro do app.", "contact_label": "Contato", "contact_btn": "Enviar e-mail", "faq_h": "Perguntas frequentes", "faq1_q": "O que é grátis e o que o Pro libera?", "faq1_a": "Alguns livros podem ser lidos de graça, sem cadastro nem compra. O DreamBook Pro libera a biblioteca inteira, inclusive os livros adicionados depois. Os planos e preços disponíveis aparecem na página Pro do app.", "faq2_q": "Como restauro minha compra em um aparelho novo?", "faq2_a": "Entre com o mesmo ID Apple, abra a página Pro do app e toque em “Restaurar Compras”. Não é preciso criar nada conosco: sua compra está vinculada ao seu ID Apple.", "faq3_q": "Como cancelo uma assinatura ou peço reembolso?", "faq3_a": "As assinaturas são gerenciadas pela Apple: abra Ajustes do iOS → seu nome → Assinaturas → DreamBook e cancele pelo menos 24 horas antes da data de renovação. Os reembolsos são tratados pela Apple em reportaproblem.apple.com.", "faq4_q": "Um livro não baixa ou a biblioteca está vazia.", "faq4_a": "Os livros são baixados do nosso servidor, então é preciso ter conexão com a internet. Verifique a conexão e tente de novo; se aparecer “muitas solicitações”, espere um minuto. Livros já baixados podem ser lidos off-line. Se continuar falhando, escreva para nós com o nome do livro.", "faq5_q": "A voz da leitura está muda ou soa estranha.", "faq5_a": "A leitura em voz alta usa a voz integrada do iOS, no seu aparelho. Verifique o volume e baixe uma voz melhor em Ajustes do iOS → Acessibilidade → Conteúdo Falado → Vozes. Se continuar muda, escreva para nós informando a versão do seu iOS.", "faq6_q": "Vocês coletam informações sobre o meu filho?", "faq6_a": "Não é preciso ter conta e não coletamos nome, e-mail nem localização. Não há anúncios nem rastreamento de terceiros. O app só se comunica com o nosso servidor para listar e baixar livros e, se você quiser, para enviar sugestões. Os detalhes estão na política de privacidade abaixo.", "privacy_link": "Política de Privacidade"}, "ru": {"app_name": "DreamBook", "tagline": "Объёмные сказки с озвучкой", "support_h": "Поддержка и помощь", "support_p": "Спасибо, что читаете с DreamBook. Если что-то не работает, есть идея или просто нужна помощь — напишите нам: каждое письмо читает человек. Отзыв со скриншотами можно отправить и прямо из «Настроек» в приложении.", "contact_label": "Контакты", "contact_btn": "Написать нам", "faq_h": "Частые вопросы", "faq1_q": "Что бесплатно и что открывает Pro?", "faq1_a": "Часть книг можно читать бесплатно — без регистрации и покупки. DreamBook Pro открывает всю библиотеку, включая книги, которые появятся позже. Доступные тарифы и цены показаны на странице Pro в приложении.", "faq2_q": "Как восстановить покупку на новом устройстве?", "faq2_a": "Войдите с той же учётной записью Apple, откройте страницу Pro в приложении и нажмите «Восстановить покупки». Создавать что-либо у нас не нужно — покупка привязана к вашей учётной записи Apple.", "faq3_q": "Как отменить подписку или запросить возврат?", "faq3_a": "Подписками управляет Apple: откройте «Настройки» iOS → ваше имя → «Подписки» → DreamBook и отмените не позднее чем за 24 часа до даты продления. Возвраты обрабатывает Apple на reportaproblem.apple.com.", "faq4_q": "Книга не скачивается или библиотека пуста.", "faq4_a": "Книги скачиваются с нашего сервера, поэтому нужно подключение к интернету. Проверьте соединение и повторите; если появилось «слишком много запросов», подождите минуту. Уже скачанные книги можно читать офлайн. Если не помогает, напишите нам и укажите название книги.", "faq5_q": "Озвучка молчит или звучит странно.", "faq5_a": "Озвучка использует встроенный в iOS голос прямо на вашем устройстве. Проверьте громкость и скачайте голос получше в «Настройки» iOS → «Универсальный доступ» → «Устное содержимое» → «Голоса». Если звука всё равно нет, напишите нам и укажите версию iOS.", "faq6_q": "Собираете ли вы сведения о моём ребёнке?", "faq6_a": "Учётная запись не нужна, имена, адреса электронной почты и местоположение мы не собираем. Рекламы и сторонней аналитики нет. Приложение обращается к нашему серверу только чтобы показать список книг и скачать их и — если вы решите — отправить отзыв. Подробности — в политике конфиденциальности ниже.", "privacy_link": "Политика конфиденциальности"}};
    const SUP = ["en", "zh-Hans", "zh-Hant", "ja", "ko", "de", "fr", "es", "it", "pt-BR", "ru"];
    function norm(p){p=p.toLowerCase();
      if(p.startsWith('zh')) return (p.includes('hant')||p.includes('tw')||p.includes('hk'))?'zh-Hant':'zh-Hans';
      if(p.startsWith('pt')) return 'pt-BR';
      const b=p.slice(0,2), m={en:'en',ja:'ja',ko:'ko',de:'de',fr:'fr',es:'es',it:'it',ru:'ru'};
      return m[b]||null;}
    function detect(){
      const h=(location.hash.match(/lang=([\w-]+)/)||[])[1];
      if(h&&I18N[h]) return h;
      for(const p of (navigator.languages||[navigator.language||'en'])){const n=norm(p); if(n&&I18N[n]) return n;}
      return 'en';}
    function apply(lang){
      const d=I18N[lang]||I18N.en;
      document.documentElement.lang=lang;
      document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=d[el.dataset.i18n]||'';});
      const sel=document.getElementById('lang'); if(sel) sel.value=lang;
      history.replaceState(null,'','#lang='+lang);}
    const sel=document.getElementById('lang');
    if(sel) sel.addEventListener('change',e=>apply(e.target.value));
    apply(detect());
  </script>
